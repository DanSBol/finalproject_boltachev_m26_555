[project]
name = "finalproject_boltachev_m26_555"
version = "0.1.0"
description = "Console currency wallet simulator"
requires-python = ">=3.11"
dependencies = [
  "prettytable>=3.0.0",
  "python-dotenv>=1.2.4",
  "requests>=2.34.2",
  "ruff>=0.9.0",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["valutatrade_hub/tests"]
pythonpath = ["."]
addopts = "-v"
